name: parity / nightly dashboard (cljd)

on:
  schedule:
    # 06:45 UTC daily -- staggered after the joker run.
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      cljd_ref:
        description: 'ClojureDart git ref to check out (default: main)'
        required: false
        default: main

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parity tool
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout ClojureDart
        uses: actions/checkout@v4
        with:
          repository: Tensegritics/ClojureDart
          path: cljd-checkout
          ref: ${{ github.event.inputs.cljd_ref || 'main' }}

      - name: Capture cljd surface
        env:
          CLJD_CHECKOUT: ${{ github.workspace }}/cljd-checkout
        run: clojure -M:run dump cljd

      - name: Produce dashboard
        env:
          CLJD_CHECKOUT: ${{ github.workspace }}/cljd-checkout
        run: clojure -M:run diff cljd

      - name: Commit artifacts
        run: |
          git config user.name  "parity-nightly[bot]"
          git config user.email "parity-nightly@users.noreply.github.com"
          git add output/cljd/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: cljd parity dashboard ${DATE}"
            git push
          fi

      - name: Upload dashboard as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard-cljd
          path: |
            output/cljd/dashboard.edn
            output/cljd/badge.json
            output/cljd/surface.edn
            output/cljd/history/
