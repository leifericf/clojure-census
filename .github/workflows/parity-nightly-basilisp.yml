name: parity / nightly dashboard (basilisp)

on:
  schedule:
    # 06:15 UTC daily -- staggered after the jank run.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      basilisp_version:
        description: 'Basilisp version to install (default: latest)'
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parity tool
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Basilisp
        run: |
          if [ "${{ github.event.inputs.basilisp_version }}" = "latest" ] || \
             [ -z "${{ github.event.inputs.basilisp_version }}" ]; then
            pip install --upgrade basilisp
          else
            pip install "basilisp==${{ github.event.inputs.basilisp_version }}"
          fi
          basilisp version

      - name: Capture basilisp surface
        run: clojure -M:run dump basilisp

      - name: Produce dashboard
        run: clojure -M:run diff basilisp

      - name: Commit artifacts
        run: |
          git config user.name  "parity-nightly[bot]"
          git config user.email "parity-nightly@users.noreply.github.com"
          git add output/basilisp/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: basilisp parity dashboard ${DATE}"
            # Concurrent nightly runs all push to main; rebase + retry to avoid losing the race.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Upload dashboard as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard-basilisp
          path: |
            output/basilisp/dashboard.edn
            output/basilisp/badge.json
            output/basilisp/surface.edn
            output/basilisp/history/
