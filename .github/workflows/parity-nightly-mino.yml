name: parity / nightly dashboard

on:
  schedule:
    # 05:00 UTC daily
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mino_ref:
        description: 'mino ref to build (default: main)'
        required: false
        default: main

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    env:
      MINO_REF: ${{ github.event.inputs.mino_ref || 'main' }}

    steps:
      - name: Checkout parity tool
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkout mino
        uses: actions/checkout@v4
        with:
          repository: leifericf/mino
          ref: ${{ env.MINO_REF }}
          path: mino

      - name: Build mino
        working-directory: mino
        run: make

      - name: Capture mino surface
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
        run: clojure -M:run dump mino

      - name: Evaluate behavior catalog
        # Writes output/mino/behavior.edn. Diff folds it into the
        # dashboard opportunistically on the next step.
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
        run: clojure -M:run behavior mino

      - name: Produce dashboard
        env:
          MINO_BIN: ${{ github.workspace }}/mino/mino
        run: clojure -M:run diff mino

      - name: Commit artifacts
        run: |
          git config user.name  "parity-nightly[bot]"
          git config user.email "parity-nightly@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: parity dashboard ${DATE}"
            # Concurrent nightly runs all push to main; rebase + retry to avoid losing the race.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Upload dashboard as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard
          path: |
            output/mino/dashboard.edn
            output/mino/badge.json
            output/mino/surface.edn
            output/mino/behavior.edn
            output/mino/history/
