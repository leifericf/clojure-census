name: signal sync

on:
  schedule:
    # 06:00 UTC daily -- after parity-nightly-mino.yml (05:00)
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout census
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ---- upstream suite signal (from mino) ----

      - name: Checkout mino
        uses: actions/checkout@v4
        with:
          repository: leifericf/mino
          path: mino

      - name: Build mino
        working-directory: mino
        run: make

      - name: Run test suite with summary
        working-directory: mino
        run: ./mino task test-summary

      - name: Copy upstream suite signal
        run: |
          mkdir -p data/mino/signals
          cp mino/output/test-results.edn data/mino/signals/upstream_suite.edn

      # ---- ClojureDocs probe signal (from mino-tests) ----

      - name: Checkout mino-tests
        uses: actions/checkout@v4
        with:
          repository: leifericf/mino-tests
          path: mino-tests
          submodules: true

      - name: Run ClojureDocs probe summary
        working-directory: mino-tests
        run: ./mino/mino task clojuredocs-summary

      - name: Copy ClojureDocs signal
        run: cp mino-tests/output/clojuredocs-results.edn data/mino/signals/clojuredocs_probe.edn

      # ---- fuzz signal (from mino-bench) ----

      - name: Checkout mino-bench
        uses: actions/checkout@v4
        with:
          repository: leifericf/mino-bench
          path: mino-bench
          submodules: true

      - name: Run fuzz summary
        working-directory: mino-bench
        run: ./mino/mino task fuzz-summary

      - name: Copy fuzz signal
        run: cp mino-bench/output/fuzz-results.edn data/mino/signals/fuzz.edn

      # ---- regenerate payload with fresh signals ----

      - name: Regenerate site payload
        run: clojure -M:run payload mino

      # ---- commit if anything changed ----

      - name: Commit signal updates
        run: |
          git config user.name  "signal-sync[bot]"
          git config user.email "signal-sync@users.noreply.github.com"
          git add data/mino/signals/ output/mino/site_payload.edn
          if git diff --cached --quiet; then
            echo "no signal changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: signal sync ${DATE}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi
