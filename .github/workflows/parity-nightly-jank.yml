name: parity / nightly dashboard (jank)

on:
  schedule:
    # 06:00 UTC daily -- staggered after the other dialect runs.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout parity tool
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install jank via the jank-lang APT repo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl gnupg ca-certificates lsb-release
          curl -s "https://ppa.jank-lang.org/KEY.gpg" \
            | gpg --dearmor \
            | sudo tee /etc/apt/trusted.gpg.d/jank.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/jank.gpg] https://ppa.jank-lang.org $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/jank.list >/dev/null
          sudo apt-get update -y
          sudo apt-get install -y jank

      - name: Confirm jank install
        run: jank check-health

      - name: Capture jank surface
        run: clojure -M:run dump jank

      - name: Produce dashboard
        run: clojure -M:run diff jank

      - name: Commit artifacts
        run: |
          git config user.name  "parity-nightly[bot]"
          git config user.email "parity-nightly@users.noreply.github.com"
          git add output/jank/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: jank parity dashboard ${DATE}"
            # Concurrent nightly runs all push to main; rebase + retry to avoid losing the race.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Upload dashboard as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard-jank
          path: |
            output/jank/dashboard.edn
            output/jank/badge.json
            output/jank/surface.edn
            output/jank/history/
