name: parity / nightly dashboard (clr)

on:
  schedule:
    # 05:45 UTC daily -- staggered after the other dialect runs
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      clr_main_version:
        description: 'Clojure.Main version (default: latest stable)'
        required: false
        default: latest

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    env:
      # Clojure.Main 1.12.x ships as a .NET 9 self-contained tool.
      # actions/setup-dotnet sets DOTNET_ROOT for the chosen version.
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout parity tool
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Clojure.Main as a global dotnet tool
        run: dotnet tool install --global Clojure.Main

      - name: Ensure ~/.dotnet/tools is on PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Capture clr surface
        run: clojure -M:run dump clr

      - name: Evaluate behavior catalog
        # Writes output/clr/behavior.edn. Diff folds it into the
        # dashboard opportunistically on the next step.
        run: clojure -M:run behavior clr

      - name: Produce dashboard
        run: clojure -M:run diff clr

      - name: Commit artifacts
        run: |
          git config user.name  "parity-nightly[bot]"
          git config user.email "parity-nightly@users.noreply.github.com"
          git add output/clr/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: clr parity dashboard ${DATE}"
            # setup-dotnet@v4 sometimes loses the http.extraheader credential set by actions/checkout, so re-add it.
            git config http.https://github.com/.extraheader "AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}"
            # Concurrent nightly runs all push to main; rebase + retry to avoid losing the race.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Upload dashboard as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard-clr
          path: |
            output/clr/dashboard.edn
            output/clr/badge.json
            output/clr/surface.edn
            output/clr/behavior.edn
            output/clr/history/
