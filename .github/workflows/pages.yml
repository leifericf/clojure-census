name: pages / build & deploy

on:
  push:
    branches: [main]
    paths:
      - 'output/**'
      - 'site/**'
      - 'dialects/**'
      - 'canon/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-site-${{ hashFiles('site/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-site-

      - name: Build site
        # Custom domain (clojure-census.leifericf.com) serves the site
        # from the root of the host, so SITE_BASE stays empty in CI.
        # site/resources/public/CNAME signals the custom domain to
        # GitHub Pages.
        working-directory: site
        run: clojure -M:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
