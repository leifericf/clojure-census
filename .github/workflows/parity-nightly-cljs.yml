name: parity / nightly dashboard (cljs)

on:
  schedule:
    # 05:30 UTC daily -- staggered 30min after the mino run
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      planck_version:
        description: 'Planck version (default: latest brew bottle)'
        required: false
        default: latest

jobs:
  build-dashboard:
    # macOS runner because planck's official distribution is via
    # Homebrew bottles; Linux requires building from source.
    runs-on: macos-latest

    steps:
      - name: Checkout parity tool
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: 1.12.4.1618

      - name: Cache Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Planck via Homebrew
        run: brew install planck

      - name: Capture cljs surface
        run: clojure -M:run dump cljs

      - name: Produce dashboard
        run: clojure -M:run diff cljs

      - name: Commit artifacts
        run: |
          git config user.name  "parity-nightly[bot]"
          git config user.email "parity-nightly@users.noreply.github.com"
          git add output/cljs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "nightly: cljs parity dashboard ${DATE}"
            git push
          fi

      - name: Upload dashboard as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-dashboard-cljs
          path: |
            output/cljs/dashboard.md
            output/cljs/dashboard.json
            output/cljs/badge.json
            output/cljs/surface.edn
            output/cljs/history/
